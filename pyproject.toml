[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "MolSym"
dynamic = ["version"]
description = "A program for molecular symmetry detection and SALC construction"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Stephen Goodlett", email = "stephen.goodlett@org.chemie.uni-giessen.de" },
    { name = "Nate Kitzmiller", email = "nate.kitzmiller@indwes.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy >= 1.23.4",
]

[project.optional-dependencies]
qcel = [
    "qcelemental >= 0.50.0",
]

[project.urls]
Homepage = "https://github.com/NASymmetry/MolSym"
Documentation = "https://molsym.readthedocs.io"

[tool.setuptools.packages.find]
include = ["molsym*"]

[tool.setuptools_scm]
